[package]
name = "zeequent-core"
version.workspace = true
edition.workspace = true

[features]
# Multi-threaded proving: column commitments, coset FFTs and the quotient.
parallel = [
    "zeequent-kzg/parallel",
    "ark-ec/parallel",
    "ark-ff/parallel",
    "ark-poly/parallel",
    "ark-std/parallel",
    "dep:rayon",
]

[dependencies]
zeequent-types = { path = "../zeequent-types" }
zeequent-kzg = { path = "../zeequent-kzg" }
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-poly = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
rayon = { version = "1", optional = true }
